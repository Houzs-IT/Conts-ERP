# Scheduled worker (theconts-cron), deployed separately from Pages:
#   node scripts/cron-deploy.mjs          checks the Cloudflare account and this file, then deploys
#
# Pages Functions route by file path; a cron handler cannot live in functions/.
# This Worker uses the same production database (Hyperdrive, same id as wrangler.toml) and the same job code
# (functions/_lib/cronJobs.ts) as the local dry run: node scripts/cron-dry-run.mjs
#
# Secrets (set once with `npx wrangler secret put <NAME> --config wrangler.cron.toml`, typed at the prompt):
#   CHANNEX_API_KEY      needed for the Channex outbox; without it that job reports "not configured"
#   HOSTPLATFORM_ACCESS_TOKEN   needed to pull reservations from HostPlatform every 5 minutes; without it that job reports "not configured"
#   MAIL_API_KEY         optional: email copies and owner emails
#   WHATSAPP_TOKEN, WHATSAPP_PHONE_ID   optional: WhatsApp copies
#   IT_HUB_API_KEY       optional: the same key the Pages project uses for IT Support; with it, the worker asks
#                        the website to send its health report to the Houzs IT Hub every 5 minutes

name = "theconts-cron"
main = "worker/scheduled.ts"
compatibility_date = "2026-09-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "e0781ccdee9046919161c28cb95694c0"

[triggers]
crons = [
  "* * * * *",      # Channex outbox: retries and anything the request-time flush missed
  "*/5 * * * *",    # HostPlatform: pull the reservations it changed since the last run (its webhook slot is StreamHost's)
  "*/15 * * * *",   # email / WhatsApp outbox (quiet hours, retries); release calendar blocks of finished repair jobs
  "0 * * * *",      # overdue cleans and repairs; statements finalised but unsent
  "0 0 * * *",      # 08:00 Malaysia: the "today" digest for operations
]

[vars]
TIMEZONE = "Asia/Kuala_Lumpur"
QUIET_HOURS_START = "22"
QUIET_HOURS_END = "8"
CHANNEX_BASE_URL = "https://app.channex.io"
# HostPlatform External API (hostplatformPull in functions/_lib/cronJobs.ts). The access token is the secret
# HOSTPLATFORM_ACCESS_TOKEN (npx wrangler secret put HOSTPLATFORM_ACCESS_TOKEN --config wrangler.cron.toml).
HOSTPLATFORM_BASE_URL = "https://nebulapi-asg.hostplatform.com"
# The website the worker asks to send its health report to the Houzs IT Hub (hubHealthReport in
# functions/_lib/cronJobs.ts): the address staff use, which the Channex callback is registered against.
APP_ORIGIN = "https://erp.theconts.com"
