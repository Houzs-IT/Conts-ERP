# Scheduled worker, deployed separately from Pages.
#   npx wrangler deploy --config wrangler.cron.toml
#
# Pages Functions route by file path; a cron handler cannot live in functions/.
# This Worker shares the same Supabase database (via Hyperdrive) as the Pages app.

name = "theconts-cron"
main = "worker/scheduled.ts"
compatibility_date = "2026-09-17"
compatibility_flags = ["nodejs_compat"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "e0781ccdee9046919161c28cb95694c0"

[triggers]
crons = [
  "* * * * *",      # send the Channex outbox: retries and anything the request-time flush missed
  "*/15 * * * *",   # drain the quiet-hours notification queue
  "0 * * * *",      # SLA sweep: move overdue tasks, flag unsent statements
]

[vars]
TIMEZONE = "Asia/Kuala_Lumpur"
QUIET_HOURS_START = "22"
QUIET_HOURS_END = "8"
CHANNEX_BASE_URL = "https://app.channex.io"
