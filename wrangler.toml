# Conts ERP — Cloudflare Pages configuration
#
# Only bindings the code actually uses are active. Unused bindings with
# placeholder ids fail `wrangler deploy` immediately, so anything not yet wired
# up is commented out with a note on what to do when it is needed.
#
# Cron lives in wrangler.cron.toml, not here: Pages Functions route by file
# path, so a scheduled handler has to be its own Worker.

name = "theconts-os"
compatibility_date = "2026-09-17"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ---------------------------------------------------------------------------
# Production
# ---------------------------------------------------------------------------

# The database is Supabase Postgres (schema `pos`), reached through Hyperdrive as the
# `pos_app` role. Create the Hyperdrive config once and paste its id here:
#   npx wrangler hyperdrive create conts-erp-pos --connection-string="postgresql://pos_app.<project-ref>:<password>@<pooler-host>:5432/postgres"
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "e0781ccdee9046919161c28cb95694c0"

# Media storage for photos and documents (documents.storage_key).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "theconts-media"

# Not used. Sessions are stateless HMAC-signed cookies — see
# functions/_lib/auth.ts. A KV namespace would only be needed to support
# server-side revocation of individual sessions.
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "REPLACE_ME_KV_ID"

[vars]
APP_NAME = "Conts ERP"
DEFAULT_LOCALE = "en-MY"
TIMEZONE = "Asia/Kuala_Lumpur"
CURRENCY = "MYR"
CURRENCY_PREFIX = "RM "
# Money is stored as INTEGER sen. 1245000 = RM 12,450.00
MONEY_MINOR_UNITS = "100"
RESET_TOKEN_MINUTES = "60"
QUIET_HOURS_START = "22"
QUIET_HOURS_END = "8"
CHANNEX_BASE_URL = "https://app.channex.io"

# ---------------------------------------------------------------------------
# Secrets — never in this file. Set each with:
#   npx wrangler secret put NAME
#
#   SESSION_SECRET     required. Any long random string; rotating it signs
#                      everyone out. `npm run setup` generates one for local dev
#                      in .dev.vars, which is gitignored.
#   MAIL_API_KEY       optional. Transactional email provider.
#   WHATSAPP_TOKEN     optional. WhatsApp Business Cloud API token.
#   WHATSAPP_PHONE_ID  optional. WhatsApp Business phone number id.
#
# Without the mail or WhatsApp values, notify() records the send as queued and
# returns without throwing — a missing provider never breaks the action that
# triggered it. See functions/_lib/notify.ts.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Staging: Pages only has "production" and "preview". Preview deploys (any non-production
# branch) use the STAGING Supabase project through this Hyperdrive config, so a preview can
# never touch production data. Bindings are not inherited, so [vars] are repeated.
# ---------------------------------------------------------------------------
[env.preview]
[[env.preview.hyperdrive]]
binding = "HYPERDRIVE"
id = "9c21c4f2b5f9470cb7df0afeb9ad633f"

# Separate bucket from production, same isolation reasoning as the Hyperdrive above.
[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "theconts-media-staging"

[env.preview.vars]
APP_NAME = "Conts ERP (staging)"
DEFAULT_LOCALE = "en-MY"
TIMEZONE = "Asia/Kuala_Lumpur"
CURRENCY = "MYR"
CURRENCY_PREFIX = "RM "
MONEY_MINOR_UNITS = "100"
RESET_TOKEN_MINUTES = "60"
QUIET_HOURS_START = "22"
QUIET_HOURS_END = "8"
CHANNEX_BASE_URL = "https://staging.channex.io"
# The supply chain engine on staging (engine/). The shared secret is SCM_ENGINE_SSO_SECRET, set as a secret.
SCM_ENGINE_API = "https://conts-scm-engine-staging.conts-erp.workers.dev"
SCM_ENGINE_SITE = "https://theconts-scm.pages.dev"
