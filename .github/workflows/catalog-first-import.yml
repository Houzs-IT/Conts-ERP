# One-off (owner, 20 Oct 2026): the first renovation catalog import (scripts/catalog-first-import.mjs,
# docs/catalog-import) into the production engine database, which is reachable only through the PROD_DB_URL
# secret. Manual only. "dry-run" reads and prints the plan; "apply" also needs the production project ref typed
# into confirm_ref. Delete this file once the import is done.
name: Catalog first import (one-off)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run or apply
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply]
      confirm_ref:
        description: production project ref, required for apply
        required: false
        default: ''
permissions:
  contents: read
concurrency: catalog-first-import
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Run the import
        env:
          DATABASE_URL: ${{ secrets.PROD_DB_URL }}
          MODE: ${{ inputs.mode }}
          CONFIRM_REF: ${{ inputs.confirm_ref }}
        run: |
          if [ "$MODE" = "apply" ]; then
            node scripts/catalog-first-import.mjs --confirm-ref="$CONFIRM_REF"
          else
            node scripts/catalog-first-import.mjs --dry-run
          fi
