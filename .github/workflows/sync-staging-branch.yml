# Keeps `staging` level with `main` after every merge, so staging-preview always
# reflects what's actually live on production unless someone deliberately pushes
# extra commits to `staging` for a one-off preview. If `staging` has diverged
# (preview-only commits not in main), those commits are first saved on a
# `staging-backup/<timestamp>` branch, then `staging` is reset to main. Nothing is
# lost and the sync never needs a manual fix. Delete old backup branches when
# you no longer need them.
#
# Deploys right here instead of leaving it to deploy-staging-preview.yml's own
# `push: branches: [staging]` trigger: a push made with the default GITHUB_TOKEN
# (like the one below) does not fire other workflows — that's a deliberate
# GitHub Actions guard against infinite trigger loops, not a bug — so relying on
# that trigger would silently never deploy. deploy-staging-preview.yml still
# does fire on its own for a genuine human push straight to `staging`.
name: Sync staging branch with main
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: sync-staging-branch
permissions:
  contents: write
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move staging to main, backing up preview-only commits
        run: |
          if git merge-base --is-ancestor origin/staging origin/main; then
            git push origin origin/main:refs/heads/staging
          else
            git push origin "origin/staging:refs/heads/staging-backup/$(date -u +%Y%m%d-%H%M%S)"
            git push --force-with-lease=staging:"$(git rev-parse origin/staging)" origin origin/main:refs/heads/staging
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler pages deploy dist --project-name=theconts-os --branch=staging-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3a9ff01edda85702f9e2649fb340f1cc
