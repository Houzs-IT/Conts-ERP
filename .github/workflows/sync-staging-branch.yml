# Puts the staging-preview site level with `main` after every merge, so it always shows what is live on
# production. It no longer moves the `staging` branch: the ruleset on `staging` (changes only through a
# pull request, no force-push) refused the old push, so this workflow failed on every merge and the site was
# never redeployed. Bring the branch up to date with a pull request from main into staging when needed.
# The `staging-backup/*` branches left by the old runs are copies of staging and can be deleted.
#
# The engine staging deploy has its own trigger on pushes to main (deploy-engine-staging.yml).
name: Deploy staging preview from main
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: sync-staging-branch
permissions:
  contents: read
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler pages deploy dist --project-name=theconts-os --branch=staging-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3a9ff01edda85702f9e2649fb340f1cc
