# Deploys Property OS to the staging-preview Cloudflare Pages environment (staging
# Supabase project, staging R2 bucket — see wrangler.toml [env.preview]) whenever the
# `staging` branch moves. `staging` itself is kept level with `main` automatically by
# sync-staging-branch.yml, so this fires right after every merge to main, and can also
# be pushed to directly for a one-off preview of something not on main yet.
name: Deploy Staging Preview
on:
  push:
    branches: [staging]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - 'tokens.css'
      - 'tokens.json'
      - '.github/workflows/deploy-staging-preview.yml'
  workflow_dispatch:
concurrency: deploy-staging-preview
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler pages deploy dist --project-name=theconts-os --branch=staging-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3a9ff01edda85702f9e2649fb340f1cc
