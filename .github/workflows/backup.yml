# Nightly backup of the production Property OS data (schema pos + public.pos_migrations), kept as an
# encrypted artifact on this repository for 30 days. No other cloud account is involved.
# Needs two repository secrets, added by the owner (docs/DR-RUNBOOK.md says where to click):
#   PROD_DB_URL         the production database's "Session pooler" connection string (Supabase)
#   BACKUP_PASSPHRASE   the passphrase the backup is encrypted with; keep a copy outside GitHub
# Restore: scripts/restore-backup.mjs (docs/DR-RUNBOOK.md).
name: Nightly database backup
on:
  schedule:
    - cron: '30 18 * * *' # 02:30 Malaysia time
  workflow_dispatch:
permissions:
  contents: read
concurrency: database-backup
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check the secrets are there
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=""
          [ -n "$PROD_DB_URL" ] || missing="$missing PROD_DB_URL"
          [ -n "$BACKUP_PASSPHRASE" ] || missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Repository secret(s) not set:$missing. See docs/DR-RUNBOOK.md, step 1."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/backup-dump.sh
          sparse-checkout-cone-mode: false
      # pg_dump must be at least the server's version; 18 reads every version Supabase runs (15 to 18).
      - name: Install the PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
      - name: Dump, compress and encrypt
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PG_BIN: /usr/lib/postgresql/18/bin
        run: bash scripts/backup-dump.sh backup-out
      - uses: actions/upload-artifact@v4
        with:
          name: conts-pos-backup-${{ github.run_number }}
          path: backup-out/*.sql.gz.enc
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
