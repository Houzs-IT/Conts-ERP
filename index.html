<!doctype html>
<html lang="en-MY">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conts ERP</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <style>
      /* Opening screen. Here rather than in the app's stylesheet so it draws before any CSS or script arrives. */
      html { background: #FAF9F6; }
      .boot-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #FAF9F6; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; color: #706D67; animation: boot-in 300ms ease-out both; }
      .boot-mark { width: 52px; height: 52px; border-radius: 13px; background: #151515; display: grid; place-items: center; box-shadow: 0 10px 28px -14px rgba(21, 21, 21, 0.5); }
      .boot-mark img { display: block; }
      .boot-track { position: relative; width: 72px; height: 2px; border-radius: 2px; overflow: hidden; background: #EDEAE4; opacity: 0; animation: boot-in 300ms ease-out 400ms both; }
      .boot-bar { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 2px; background: #C8A46A; animation: boot-travel 1.4s cubic-bezier(0.45, 0, 0.25, 1) infinite; }
      /* React's copy takes over mid-animation: it must not fade in a second time. */
      .boot-live, .boot-live .boot-track { animation: none; opacity: 1; }
      .boot-file-note { display: none; max-width: 340px; margin: 0; padding: 0 24px; text-align: center; font-size: 13px; line-height: 1.55; }
      .from-file .boot-file-note { display: block; }
      .from-file .boot-track { display: none; }
      @keyframes boot-travel { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-screen, .boot-track { animation: none; opacity: 1; }
        .boot-bar { animation: none; width: 100%; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <!-- The opening screen: the gold mark on the page colour while the app's code downloads and the session is
         checked. BootScreen (src/components/Loading.tsx) renders this same markup, so nothing moves when React
         takes over. Opened straight from disk the script never runs, so the note below says what to do instead. -->
    <div id="root">
      <div class="boot-screen" role="status" aria-label="Opening The Conts">
        <div class="boot-mark"><img src="/brand/mark-gold.png" alt="" width="31" height="36" /></div>
        <div class="boot-track"><div class="boot-bar"></div></div>
        <p class="boot-file-note">This file is the Vite entry point. Run <code>npm run dev</code> and open http://localhost:8788, or open <strong>The Conts Desktop.dc.html</strong> to review the design.</p>
      </div>
    </div>
    <script>if (location.protocol === 'file:') document.documentElement.classList.add('from-file');</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
