name = "conts-erp-api"
main = "src/index.ts"
# Cloudflare account "Conts ERP". Not a secret. Pinned so a stray `wrangler login`
# can never deploy this worker into another account.
account_id = "3a9ff01edda85702f9e2649fb340f1cc"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# ── PRODUCTION (conts-erp-api) — not deployed yet ───────────────────────────
[vars]
PUBLIC_APP_URL = "https://conts-erp.pages.dev"
# Comma-separated list of sites allowed to call this API from a browser.
ALLOWED_ORIGINS = "https://conts-erp.pages.dev"
AVATAR_BUCKET = "avatars"
ENVIRONMENT = "production"

# Supabase production (cweomoenhsjvsxfsmiiw) — create the Hyperdrive config first.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_CONTS_PROD_HYPERDRIVE_ID"

[observability]
[observability.logs]
enabled = true

# Secrets (set with `wrangler secret put <NAME>`, never written in this file):
#   SUPABASE_URL                — https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   — admin key; server-side only, never in a browser
#   SUPABASE_JWT_SECRET         — only if the project still uses legacy HS256 tokens

# ── STAGING (conts-erp-api-staging) ─────────────────────────────────────────
[env.staging]
name = "conts-erp-api-staging"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[env.staging.vars]
PUBLIC_APP_URL = "https://conts-erp-staging.pages.dev"
ALLOWED_ORIGINS = "https://conts-erp-staging.pages.dev,http://localhost:5173"
AVATAR_BUCKET = "avatars"
ENVIRONMENT = "staging"

# Supabase staging (ecgyrmblqfxvbfjlqkdq), session pooler port 5432, caching off.
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "477f8c56f2e64722b83eb2b241e55d92"
